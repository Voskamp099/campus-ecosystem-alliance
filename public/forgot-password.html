<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 | 北京校园生态合作联盟</title>
  <meta name="description" content="重置您的联盟账号密码。">
  <meta property="og:title" content="重置密码 | 北京校园生态合作联盟">
  <meta property="og:description" content="重置您的联盟账号密码。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script>
    (function () {
      var script = document.createElement("script");
      script.src = window.location.protocol === "file:" ? "assets/bootstrap.js" : "/assets/bootstrap.js";
      script.onload = function () { window.AllianceBootstrap.initHead(); };
      document.head.appendChild(script);
    })();
  </script>
  <style>
    :root {
      --bg: #091a33;
      --text: #e6f0ff;
      --muted: #9fb3d0;
      --accent: #60a5fa;
      --accent-2: #8b5cf6;
      --panel: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.12);
    }
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(1200px 800px at 70% -10%, rgba(96,165,250,0.18), transparent),
                  radial-gradient(900px 600px at -10% 60%, rgba(139,92,246,0.15), transparent),
                  var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(8px);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header h1 {
      font-size: 26px;
      margin: 0 0 8px;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-header p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 15px;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(96,165,250,0.35);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .notice {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .notice.error {
      display: block;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }
    .notice.success {
      display: block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
    }
    .back-link {
      position: absolute;
      top: 24px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }
    .step { display: none; }
    .step.active { display: block; }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
      .back-link { position: static; margin-bottom: 16px; display: inline-flex; }
    }
  </style>
</head>
<body>
  <a href="login.html" class="back-link" id="forgotBackLoginLink">← 返回登录</a>
  
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>重置密码</h1>
        <p id="subtitle">输入您的邮箱，我们将发送重置链接</p>
      </div>

      <div class="notice" id="notice"></div>

      <!-- 步骤1：输入邮箱 -->
      <div class="step active" id="step1">
        <form id="forgotForm">
          <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <button type="submit" class="btn-primary" id="submitBtn1">发送重置链接</button>
        </form>
      </div>

      <!-- 步骤2：输入新密码（需要token） -->
      <div class="step" id="step2">
        <form id="resetForm">
          <div class="form-group">
            <label for="newPassword">新密码</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="至少8位" required minlength="8">
          </div>
          <div class="form-group">
            <label for="confirmPassword">确认新密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入" required>
          </div>
          <button type="submit" class="btn-primary" id="submitBtn2">重置密码</button>
        </form>
      </div>

      <!-- 步骤3：完成 -->
      <div class="step" id="step3">
        <div style="text-align: center; padding: 20px 0;">
          <div style="font-size: 48px; margin-bottom: 16px;">✓</div>
          <p style="color: var(--text); margin-bottom: 24px;">密码重置成功！</p>
          <a href="login.html" class="btn-primary" id="forgotDoneLoginLink" style="display: inline-block; text-decoration: none;">去登录</a>
        </div>
      </div>

      <div class="auth-footer" id="footerLinks">
        想起密码了？<a href="login.html" id="forgotFooterLoginLink">返回登录</a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const IS_FILE_MODE = window.location.protocol === 'file:';
      const API_BASE = IS_FILE_MODE ? 'http://localhost:3000/api' : '/api';
      const LOGIN_PAGE = IS_FILE_MODE ? 'login.html' : '/login.html';

      document.getElementById('forgotBackLoginLink').href = LOGIN_PAGE;
      document.getElementById('forgotDoneLoginLink').href = LOGIN_PAGE;
      document.getElementById('forgotFooterLoginLink').href = LOGIN_PAGE;
      
      // 检查URL是否有reset token
      const urlParams = new URLSearchParams(window.location.search);
      const resetToken = urlParams.get('token');
      
      if (resetToken) {
        showStep(2);
      }

      function showStep(n) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        
        if (n === 3) {
          document.getElementById('subtitle').textContent = '您的密码已更新';
          document.getElementById('footerLinks').style.display = 'none';
        }
      }

      // 步骤1：发送重置邮件
      document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn1');
        const notice = document.getElementById('notice');
        const email = document.getElementById('email').value.trim();

        btn.disabled = true;
        btn.textContent = '发送中...';
        notice.className = 'notice';

        try {
          const res = await fetch(`${API_BASE}/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          
          const data = await res.json();
          
          if (data.success) {
            notice.className = 'notice success';
            notice.textContent = '如果该邮箱已注册，我们将发送密码重置链接，请查收邮件';
            document.getElementById('forgotForm').reset();
          } else {
            notice.className = 'notice error';
            notice.textContent = data.message || '请求失败';
          }
        } catch (err) {
          notice.className = 'notice error';
          notice.textContent = '网络错误，请稍后重试';
        } finally {
          btn.disabled = false;
          btn.textContent = '发送重置链接';
        }
      });

      // 步骤2：重置密码
      document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn2');
        const notice = document.getElementById('notice');
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
          notice.className = 'notice error';
          notice.textContent = '两次输入的密码不一致';
          return;
        }

        if (newPassword.length < 6) {
          notice.className = 'notice error';
          notice.textContent = '密码至少需要8位';
          return;
        }

        btn.disabled = true;
        btn.textContent = '重置中...';
        notice.className = 'notice';

        try {
          const res = await fetch(`${API_BASE}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, newPassword })
          });
          
          const data = await res.json();
          
          if (data.success) {
            showStep(3);
          } else {
            notice.className = 'notice error';
            notice.textContent = data.message || '重置失败';
          }
        } catch (err) {
          notice.className = 'notice error';
          notice.textContent = '网络错误，请稍后重试';
        } finally {
          btn.disabled = false;
          btn.textContent = '重置密码';
        }
      });
    })();
  </script>
<script>
  (function loadForgotAuthScript() {
    const script = document.createElement("script");
    script.defer = true;
    script.src = window.location.protocol === "file:" ? "assets/nav-auth.js" : "/assets/nav-auth.js";
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
