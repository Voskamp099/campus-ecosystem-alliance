<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对接进度查询 | 北京校园生态合作联盟</title>
  <meta name="description" content="通过查询编号和联系方式，查看生态对接申请的最新处理进度。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var script = document.createElement("script");
      script.src = window.location.protocol === "file:" ? "public/assets/bootstrap.js" : "/assets/bootstrap.js";
      script.onload = function () { window.AllianceBootstrap.initHead(); };
      document.head.appendChild(script);
    })();
  </script>
  <style>
    :root {
      --bg: #071320;
      --panel: rgba(10, 23, 42, 0.82);
      --line: rgba(96,165,250,0.18);
      --line-strong: rgba(96,165,250,0.3);
      --text: #eff6ff;
      --text-soft: rgba(239,246,255,0.72);
      --brand: #60a5fa;
      --brand-strong: #2563eb;
      --radius: 28px;
      --radius-md: 18px;
      --shadow: 0 24px 60px rgba(0,0,0,0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(96,165,250,0.2), transparent 28%),
        linear-gradient(180deg, #071320, #081625 100%);
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      text-decoration: none;
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(340px, 0.95fr);
      gap: 22px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      padding: 28px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(96,165,250,0.24);
      background: rgba(96,165,250,0.08);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(34px, 4.8vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.8;
    }
    .query-card {
      margin-top: 22px;
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }
    .query-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: rgba(239,246,255,0.92);
      font-weight: 600;
    }
    input {
      width: 100%;
      border: 1px solid rgba(148,163,184,0.2);
      background: rgba(2,6,23,0.46);
      color: var(--text);
      border-radius: 16px;
      padding: 14px 16px;
      outline: none;
    }
    input:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 4px rgba(96,165,250,0.12);
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 999px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font: inherit;
    }
    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--brand-strong), var(--brand));
      box-shadow: 0 14px 30px rgba(37,99,235,0.28);
    }
    .btn-secondary {
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border-color: var(--line);
    }
    .status-wrap {
      display: grid;
      gap: 16px;
    }
    .status-empty {
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px dashed rgba(148,163,184,0.2);
      color: var(--text-soft);
      text-align: center;
    }
    .status-card {
      padding: 22px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }
    .status-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .status-title {
      font-size: 22px;
      font-weight: 800;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      font-weight: 700;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .meta-box {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .meta-box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: rgba(239,246,255,0.62);
    }
    .timeline {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }
    .timeline-item {
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-soft);
      line-height: 1.7;
    }
    .notice {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(96,165,250,0.16);
      background: rgba(255,255,255,0.04);
      color: var(--text-soft);
      line-height: 1.7;
    }
    .notice.error {
      border-color: rgba(244,63,94,0.24);
      background: rgba(244,63,94,0.08);
      color: #fecdd3;
    }
    @media (max-width: 920px) {
      .shell {
        grid-template-columns: 1fr;
      }
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="link-btn" href="directory-apply.html">发起新的对接申请</a>
      <a class="link-btn" href="directory.html">返回生态对接名录</a>
    </div>

    <div class="shell">
      <section class="panel">
        <div class="eyebrow">Progress</div>
        <h1>对接进度查询</h1>
        <p>提交申请后，你会拿到一个查询编号。输入查询编号和你提交时填写过的联系方式，就可以查看最新处理进度。</p>

        <div class="query-card">
          <strong>我们建议保留查询编号</strong>
          <p>如果你已经登录，也可以在“我的”里查看部分申请状态；但查询编号 + 联系方式的方式最稳，也适合没有登录账号的用户。</p>
        </div>
      </section>

      <section class="panel">
        <form id="queryForm">
          <div class="form-grid">
            <div>
              <label for="trackingCode">查询编号</label>
              <input id="trackingCode" name="trackingCode" type="text" placeholder="例如：DX260424AB12CD" required>
            </div>
            <div>
              <label for="phone">手机号</label>
              <input id="phone" name="phone" type="text" placeholder="与你提交时保持一致">
            </div>
            <div>
              <label for="wechat">微信号</label>
              <input id="wechat" name="wechat" type="text" placeholder="与你提交时保持一致">
            </div>
            <div>
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" placeholder="与你提交时保持一致">
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-primary" id="queryBtn" type="submit">查询进度</button>
            <a class="btn btn-secondary" href="my.html">我的</a>
          </div>
        </form>

        <div class="notice" id="queryNotice">请至少填写一种联系方式用于核验。</div>

        <div class="status-wrap" id="statusWrap">
          <div class="status-empty">查询结果会显示在这里。</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      const script = document.createElement("script");
      script.src = window.location.protocol === "file:" ? "public/assets/directory-status.js" : "/assets/directory-status.js";
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
